name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: thapargenie
          POSTGRES_PASSWORD: thapargenie
          POSTGRES_DB: thapargenie
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U thapargenie"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgres://thapargenie:thapargenie@localhost:5432/thapargenie
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes --requirement Backend/requirements-dev.txt
      - run: python -m pip check
      - run: ruff check Backend/backend
      # At least 80% coverage for rag, chat and knowledge (see pyproject.toml).
      - run: pytest --cov --cov-report=term --cov-fail-under=80
      - run: python Backend/backend/manage.py makemigrations --check --dry-run
      - run: python Backend/backend/manage.py spectacular --validate --fail-on-warn --file /dev/null
      - name: Verify production settings
        env:
          APP_ENV: production
          DJANGO_SECRET_KEY: ci-only-check-key-W7qN4xV9sK2pL8mR5dF1hT6yB3cJ0uE4zA9gC
          DJANGO_ALLOWED_HOSTS: api.example.invalid
          CORS_ALLOWED_ORIGINS: https://app.example.invalid
          CSRF_TRUSTED_ORIGINS: https://app.example.invalid
          DATABASE_URL: postgresql://app:placeholder@db.example.invalid:5432/thapargenie
          FIREBASE_PROJECT_ID: ci-example-project
          GEMINI_API_KEY: ci-placeholder
          CHAT_MODEL: ci-model
          FAST_MODEL: ci-model
          EMBED_MODEL: ci-model
          SUPABASE_URL: https://project.example.invalid
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
        run: python Backend/backend/manage.py check --deploy --fail-level ERROR
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - name: Firebase Auth emulator integration
        run: >-
          npx --yes firebase-tools@15.30.2 emulators:exec
          --config firebase.json --only auth --project demo-thapargenie
          "FIREBASE_PROJECT_ID=demo-thapargenie
          RUN_FIREBASE_EMULATOR_TESTS=1
          python Backend/backend/manage.py test api.test_firebase_emulator"
      - run: pip-audit --requirement Backend/requirements.txt --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=high

  # Browser tests of the whole stack: the API with the offline AI
  # provider and memory storage, a production build of the SPA, and the Firebase Auth
  # emulator. No real keys or external services are used.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: thapargenie
          POSTGRES_PASSWORD: thapargenie
          POSTGRES_DB: thapargenie_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U thapargenie"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://thapargenie:thapargenie@127.0.0.1:5432/thapargenie_e2e
      E2E_PYTHON: python
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - run: python -m pip install --require-hashes --requirement ../Backend/requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Firebase Auth emulator)
        run: >-
          npx --yes firebase-tools@15.30.2 emulators:exec
          --config ../firebase.json --only auth --project demo-thapargenie
          "npm run test:e2e"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            Frontend/playwright-report
            Frontend/test-results
          retention-days: 7
