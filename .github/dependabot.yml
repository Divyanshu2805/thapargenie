version: 2
updates:
  # Backend requirements are hash-locked (uv pip compile); Dependabot's pull requests
  # need `uv pip compile --generate-hashes` re-run before merging.
  - package-ecosystem: pip
    directory: /Backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /Frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
